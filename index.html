<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>URL Extractor</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            margin: 20px;
            background-color: #0b0f14;
            color: #dbe2ea;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #141a22;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.55);
            border: 1px solid #232c38;
        }
        input[type="text"] {
            width: 70%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #2b3644;
            border-radius: 8px;
            background-color: #0f141b;
            color: #e6edf3;
            outline: none;
        }
        button {
            padding: 10px 20px;
            background-color: #2f6df6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background-color: #4b83ff;
        }
        #results {
            margin-top: 20px;
            color: #c9d3de;
            line-height: 1.6;
            word-break: break-word;
        }
        .image-item {
            margin: 20px 0;
            padding: 10px;
            border: 1px solid #2b3644;
            border-radius: 8px;
            background-color: #10161e;
        }
        #results pre {
            background-color: #0f141b;
            border: 1px solid #232c38;
            border-radius: 8px;
            padding: 14px;
            overflow-x: auto;
            color: #9fe8c4;
            font-family: Consolas, Monaco, monospace;
            font-size: 13px;
            white-space: pre-wrap;
        }
        #results code {
            background-color: #0f141b;
            border-radius: 4px;
            padding: 1px 5px;
            color: #7fd1ff;
            font-family: Consolas, Monaco, monospace;
        }
        #results a {
            color: #6fb2ff;
            text-decoration: none;
        }
        #results a:hover {
            text-decoration: underline;
        }
        #results img {
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid #232c38;
            display: block;
            margin-top: 8px;
        }
        #results table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
        }
        #results th, #results td {
            border: 1px solid #232c38;
            padding: 8px;
            text-align: left;
        }
        #results th {
            background-color: #1b232e;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>URL Extractor</h1>
        <input type="text" id="urlInput" placeholder="example.com" />
        <button onclick="showImages()">Images</button>
        <button onclick="showLinks()">Links</button>
        <button onclick="showResponse()">Response</button>
        <div id="results"></div>
    </div>
    <script src="script.js"></script>
    <script>
    (function() {
        const results = document.getElementById('results');
        if (!results) return;

        function formatResponse() {
            const text = results.textContent.trim();
            if (!text.startsWith('res:')) return;
            const jsonStr = text.slice(4).trim();
            try {
                const data = JSON.parse(jsonStr);
                let html = '<div class="response-formatted">';
                if (data.question) {
                    html += `<h3>${escapeHtml(data.question)}</h3>`;
                }
                html += '<p>';
                if (data.type) html += `<strong>Type:</strong> ${escapeHtml(data.type)} `;
                if (data.rating) html += `<strong>Rating:</strong> ${escapeHtml(data.rating)} `;
                if (data.id) html += `<strong>ID:</strong> ${escapeHtml(data.id)}`;
                html += '</p>';
                if (data.translations) {
                    html += '<h4>Translations</h4><table><tr><th>Language</th><th>Translation</th></tr>';
                    for (const [lang, trans] of Object.entries(data.translations)) {
                        html += `<tr><td>${escapeHtml(lang)}</td><td>${escapeHtml(trans)}</td></tr>`;
                    }
                    html += '</table>';
                }
                if (data.pack) {
                    html += `<p><strong>Pack:</strong> ${escapeHtml(data.pack)}</p>`;
                }
                html += '</div>';
                results.innerHTML = html;
            } catch (e) {
                // not valid JSON, leave as is
            }
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        const observer = new MutationObserver(function(mutations) {
            if (results.textContent.trim().startsWith('res:')) {
                formatResponse();
            }
        });
        observer.observe(results, { childList: true, characterData: true, subtree: true });

        if (results.textContent.trim().startsWith('res:')) {
            formatResponse();
        }
    })();
    </script>
</body>
</html>
